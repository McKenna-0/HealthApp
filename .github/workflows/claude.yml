name: Claude Code
on:
  # Respond to @claude mentions in issue/PR comments
  issue_comment:
    types: [created]

  # Auto-implement when "claude" label is added to an issue
  issues:
    types: [labeled]

  # Review PRs that Claude opens
  pull_request:
    types: [opened, synchronize]

jobs:
  # Main handler: @claude mentions in comments
  claude-comment:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          track_progress: true

  # Auto-implement: add the "claude" label to an issue
  claude-implement:
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Read the CLAUDE.md file for project context and coding conventions.

            ISSUE #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Implement this issue:
            1. Read the relevant code to understand the current state
            2. Implement the feature or fix described in the issue
            3. Run backend tests with `cd backend && uv run pytest` to verify nothing is broken
            4. Run frontend lint with `cd frontend && npm run lint`
            5. Commit your changes with a descriptive message referencing the issue
            6. Create a pull request linking to the issue

            Tech stack: FastAPI + SQLAlchemy/SQLite backend, React 19 + TypeScript + Vite frontend.
            Python managed with uv. Frontend uses React Query, Recharts, date-fns.

  # Auto-review PRs opened by Claude
  claude-review:
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.user.login, 'claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR for:
            - Correctness and potential bugs
            - Security issues (OWASP top 10)
            - Consistency with existing patterns in CLAUDE.md
            - Whether tests were added/updated as needed

            Post a summary comment with your findings.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
